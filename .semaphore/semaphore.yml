version: v1.0
name: "💎 Ruby CI Pipeline"         

# ---------------------------------------------------------------------
# GLOBAL SETTINGS
# ---------------------------------------------------------------------
agent:
  machine:
    type: e2-standard-2        # Filled by template variables
    os_image: ubuntu2404

# Fast feedback & cost control
fail_fast:
  stop:
    when: branch != 'main'          # Abort early on non-main branches
auto_cancel:
  running:
    when: branch != 'main'          # Cancel older runs on feature branches
  queued:
    when: branch = 'main'           # Keep the queue clean for main

# Common pre-steps for every job
global_job_config:
  prologue:
    commands:
      - checkout                        # Grab the code
      - sem-service start postgres 17   # Start Postgres 17
      - sem-service start redis 7       # Start Redis 7
      - sem-version ruby 3.2.2          # Select Ruby 3.2.2
      # Bundler 4 removed `bundle install --deployment`. This setting installs
      # gems into vendor/bundle and keeps Gemfile.lock frozen for every job.
      - bundle config set --local deployment true
      - cache restore                   # Pull dependencies from cache

# ---------------------------------------------------------------------
# WORKFLOW
# ---------------------------------------------------------------------
blocks:
  # ---------------- SETUP ----------------
  - name: "🛠 Setup & Cache"
    task:
      jobs:
        - name: Install Gems
          commands:
            - bundle install                                    # Install Ruby gems
            - gem install --no-document semaphore_test_boosters  # Install Boosters gem
            - cache store                                      # Save vendor/bundle
    dependencies: []

  # ------------- CODE QUALITY -------------
  - name: "🧹 RuboCop"
    task:
      jobs:
        - name: Ruby Style Check
          commands:
            - bundle exec rubocop             # Enforce Ruby style
    dependencies:
      - "🛠 Setup & Cache"

  # ------------- SECURITY -------------
  - name: "🛡️ Brakeman"
    task:
      jobs:
        - name: Static Analysis
          commands:
            - bundle exec brakeman --force    # Rails security scan
    dependencies:
      - "🛠 Setup & Cache"

  - name: "🛡️ Bundler Audit"
    task:
      jobs:
        - name: Gem CVE Check
          commands:
            - bundle exec bundle-audit check --update
    dependencies:
      - "🛠 Setup & Cache"

  # ------------- TEST SUITE (Boosters) -------------
  - name: "🚦 RSpec Suite"
    task:
      env_vars:
        - name: RAILS_ENV
          value: test              # Use the test environment
        - name: PGHOST
          value: 127.0.0.1         # PostgreSQL host
        - name: PGUSER
          value: postgres          # PostgreSQL user
        # rspec_booster only accepts --job/--dry-run. Extra RSpec flags go here.
        # The booster already adds --format documentation for the job log.
        - name: TB_RSPEC_OPTIONS
          value: "--format RspecJunitFormatter --out report.xml"
      jobs:
        - name: "🟢 RSpec Tests"
          parallelism: 5                       # Split across 5 nodes
          commands:
            - bundle exec rake db:setup        # Build fresh test DB
            # Automatic test splitting via Semaphore Boosters
            - rspec_booster --job "$SEMAPHORE_JOB_INDEX/$SEMAPHORE_JOB_COUNT"
      epilogue:
        always:
          commands:
            - '[[ -f report.xml ]] && test-results publish report.xml'
    dependencies:
      - "🧹 RuboCop"
      - "🛡️ Brakeman"
      - "🛡️ Bundler Audit"

# ---------------------------------------------------------------------
# PIPELINE SUMMARY
# ---------------------------------------------------------------------
after_pipeline:
  task:
    # Project secret with HERMES_WEBHOOK_URL and HERMES_WEBHOOK_SECRET.
    # Global job config is not applied here, so this secret must be listed on the task.
    secrets:
      - name: hermes-webhook
    jobs:
      - name: "📊 Merge Results"
        commands:
          - test-results gen-pipeline-report  # Collate JUnit reports
      - name: "Notify Hermes"
        execution_time_limit:
          minutes: 10
        commands:
          - checkout
          - python3 .semaphore/notify_hermes.py
